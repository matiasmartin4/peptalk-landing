# Publica peptalkarg.com en GitHub Pages: compila la landing (Vite) y le suma los archivos
# estáticos que no pasan por Vite (backoffice, marca, íconos, cuerpo 3D, datos del catálogo).
name: Publicar el sitio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sumar los archivos estáticos
        run: cp -R admin brand assets vendor body3d.js data.js peptides.js CNAME dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
