<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Backoffice · peptalk</title>
<link rel="icon" href="../brand/logo/peptalk-icon-light-32.png">
<link rel="stylesheet" href="../brand/tokens/tokens.css">
<link rel="stylesheet" href="admin.css?v=65421f0d">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4M8 14h.01M16 14h.01"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
</svg>

<!-- ingreso -->
<main id="login" class="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <img src="../brand/logo/peptalk-logo.svg" alt="peptalk" width="132" height="36">
    <h1>Backoffice</h1>
    <p class="muted">Entrá con tu usuario del equipo.</p>
    <label class="field"><span>Email</span><input name="email" type="email" autocomplete="username" required></label>
    <label class="field"><span>Contraseña</span><input name="password" type="password" autocomplete="current-password" required></label>
    <p class="form-msg" id="loginMsg" role="alert"></p>
    <button class="btn primary block" type="submit">Entrar</button>
    <button class="link" type="button" id="forgot">Olvidé mi contraseña</button>
    <p class="demo-note" id="demoNote" hidden>Demo sin base conectada: los cambios no se guardan. Usuarios de prueba: admin@, editor@ y medico@peptalkarg.com, con cualquier contraseña.</p>
  </form>
</main>

<!-- aplicación -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <a class="side-logo" href="#catalogo"><img src="../brand/logo/peptalk-logo.svg" alt="peptalk" width="112" height="30"><span>backoffice</span></a>
    <nav class="side-nav" id="nav">
      <a href="#catalogo" data-view="catalogo" data-roles="admin editor agente"><svg class="i"><use href="#i-list"/></svg>Catálogo</a>
      <a href="#borradores" data-view="borradores" data-roles="admin editor agente"><svg class="i"><use href="#i-inbox"/></svg>Borradores<b class="count" id="draftCount" hidden></b></a>
      <a href="#contactos" data-view="contactos" data-roles="admin medico"><svg class="i"><use href="#i-mail"/></svg>Contactos</a>
      <a href="#usuarios" data-view="usuarios" data-roles="admin"><svg class="i"><use href="#i-users"/></svg>Usuarios</a>
    </nav>
    <div class="side-foot">
      <div class="me"><b id="meName"></b><small id="meRole"></small></div>
      <button class="btn icon ghost" id="logout" type="button" aria-label="Salir"><svg class="i"><use href="#i-out"/></svg></button>
    </div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../vendor/supabase.min.js"></script>
<script src="../data.js?v=de37d963"></script>
<script src="config.js?v=2c363bd8"></script>
<script src="admin.js?v=9b9ad2ab"></script>
</body>
</html>
